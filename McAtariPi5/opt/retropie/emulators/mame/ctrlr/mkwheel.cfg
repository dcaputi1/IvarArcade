<?xml version="1.0"?>
<mameconfig version="10">
	<system name="default">
		<!-- Spy Hunter racing wheel controller profile -->
		<input>
			<!-- Trooper V2 = 0300a319242e00006a38000010010000 -->
			<mapdevice device="0300a319242e00006a38000010010000" controller="JOYCODE_1" />
			<!-- Xinmo 1 & 2 = 0300d582c0160000e105000010010000 (use for both players) -->
			<mapdevice device="0300d582c0160000e105000010010000" controller="JOYCODE_7" />
			<mapdevice device="0300d582c0160000e105000010010000" controller="JOYCODE_8" />
			<!-- Ultra-Stik = 0300c41c09d200001105000011010000 -->
			<mapdevice device="0300c41c09d200001105000011010000" controller="JOYCODE_4" />
			<!-- Mario Kart wheel = 030086650d0f00003e01000015010000 -->
			<mapdevice device="030086650d0f00003e01000015010000" controller="JOYCODE_5" />
			<!-- iCode HuiJia = 030083a08f0e00001330000011010000 (iCode setup: Port 1 Only) -->
			<mapdevice device="030083a08f0e00001330000011010000" controller="JOYCODE_10" />

			<port type="P1_BUTTON2">
				<newseq type="standard">
					JOYCODE_5_BUTTON1 OR JOYCODE_5_BUTTON2 OR JOYCODE_5_HAT1LEFT OR JOYCODE_5_HAT1DOWN OR JOYCODE_5_HAT1UP
				</newseq>
			</port>
			<port type="P1_BUTTON3">
				<newseq type="standard">
					JOYCODE_5_BUTTON5
				</newseq>
			</port>
			<port type="P1_BUTTON4">
				<newseq type="standard">
					JOYCODE_5_BUTTON4
				</newseq>
			</port>
			<port type="P1_BUTTON5">
				<newseq type="standard">
					JOYCODE_5_BUTTON3
				</newseq>
			</port>
			<port type="P1_BUTTON6">
				<newseq type="standard">
					JOYCODE_5_BUTTON6
				</newseq>
			</port>
			<port type="START1">
				<newseq type="standard">
					KEYCODE_1 OR JOYCODE_1_BUTTON6 OR JOYCODE_2_BUTTON9 OR JOYCODE_4_BUTTON7 OR JOYCODE_5_BUTTON8 OR JOYCODE_5_BUTTON9
				</newseq>
			</port>
			<port type="P1_PEDAL">
				<newseq type="standard">
					JOYCODE_5_RZAXIS
				</newseq>
			</port>
			<port type="P1_PADDLE">
				<newseq type="standard">
					JOYCODE_5_XAXIS
				</newseq>
			</port>
		</input>
	</system>
</mameconfig>
